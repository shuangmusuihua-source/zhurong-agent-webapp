<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  {{slides}}

  <script src="water-ripple.js"></script>
  <script>
    lucide.createIcons();

    // 幻灯片导航
    let currentSlide = 1;
    const totalSlides = {{totalSlides}};
    let isTransitioning = false;

    function goToSlide(n) {
      if (n < 1 || n > totalSlides || isTransitioning) return;
      if (n === currentSlide) return;

      isTransitioning = true;

      const oldSlide = document.getElementById(`slide-${currentSlide}`);
      const newSlide = document.getElementById(`slide-${n}`);

      oldSlide.style.display = 'none';
      newSlide.style.display = 'flex';

      isTransitioning = false;
      currentSlide = n;
    }

    // 初始化：隐藏所有幻灯片，只显示第一张
    for (let i = 2; i <= totalSlides; i++) {
      document.getElementById(`slide-${i}`).style.display = 'none';
    }

    // 点击导航
    document.querySelectorAll('.slide').forEach((slide, index) => {
      slide.addEventListener('click', () => {
        goToSlide(index + 1 === totalSlides ? 1 : index + 2);
      });
    });

    // 键盘导航
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        goToSlide(currentSlide + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        goToSlide(currentSlide - 1);
      }
    });
  </script>
</body>
</html>
